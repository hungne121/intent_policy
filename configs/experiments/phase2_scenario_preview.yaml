# SCENARIO PREVIEW (review before collection): a few episodes of every task T1-T5 from the demo list, scripted
# expert, no oracle features. Collect with `scripts/collect_demos.py --config <this> --per-task 2`, or record
# videos with `scripts/record_rollout.py --expert --list configs/scenario_lists/demo_v1.jsonl --per-task 1`.
experiment: phase2_scenario_preview
phase: 2
seed: 0
policy:
  config: configs/policy/act_restricted.yaml
  action_mode: restricted
  use_intent: false
intent:
  provider: none
benchmark:
  scenarios: [t1_pick_place, t2_handover, t3_assist, t4_interrupt]
  eval_list: configs/scenario_lists/eval_v1.jsonl
observation:
  cameras: [high, wrist, top]
  width: 256
  height: 192
controller: configs/controller/restricted_action.yaml
scenario_overrides:
  all:
    expert: {trigger: evidence}      # act when the target becomes predictable from the gesture
  t4_interrupt:
    expert: {yield_prediction_horizon_s: 0.5}
data:
  repo_id: local/hri_scenario_preview
  root: outputs/datasets/hri_scenario_preview
  scenario_list: configs/scenario_lists/demo_v1.jsonl
