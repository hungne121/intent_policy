# PHASE-2 ORACLE INTENTION UTILITY: No Information (masked intent, same architecture) vs Oracle
# Spatial + Future-Motion bundle, restricted head, same demonstrations / split / seeds / budget.
#
# Information-timing contract: the demonstrator commits to a target only when the target has become
# predictable from the observable gesture (`human_intention_evident`, 40% of the revealing hand motion).
# The oracle is valid from the same moment.
experiment: phase2_oracle
phase: 2
seed: 0
policy:
  config: configs/policy/act_restricted_oracle.yaml          # conditions override use_intent / intent_mask
  action_mode: restricted
intent:
  provider: oracle
  horizons_s: [0.5, 1.0]            # recorded future-hand horizons; the Phase-2 bundle uses 0.5 s
  evidence_fraction: 0.4
benchmark:
  scenarios: [t1_pick_place, t2_handover, t3_assist, t4_interrupt]
  protocol: configs/benchmark/phase2_protocol_v1.yaml
observation:
  cameras: [high, wrist, top]
  width: 256
  height: 192
controller: configs/controller/restricted_action.yaml
scenario_overrides:                  # deep-merged into every scenario YAML (the merged config is stored per episode)
  all:
    expert: {trigger: evidence}
  t4_interrupt:
    expert: {yield_prediction_horizon_s: 0.5}
data:
  repo_id: local/hri_phase2_oracle
  root: outputs/datasets/hri_phase2_oracle
  scenario_list: configs/scenario_lists/demo_v1.jsonl   # T1-T5 incl. T4-neg and the T5 changes of mind
  noise:                             # DART-style perturbation (labels stay the expert's clean actions)
    episode_fraction: 0.3
    burst_prob: 0.03
    burst_ticks: [3, 8]
training:
  steps: 20000
  batch_size: 32
  num_workers: 8
  log_every: 100
  save_every: 2000
  amp: false
  seeds: [0, 1, 2]                   # training seeds per condition
  output_root: outputs/train/phase2
