# FOUNDATION-BASELINE: LeRobot ACT, restricted head, NO intention information (Phase 1).
experiment: foundation_baseline
phase: 1
seed: 0
policy:
  config: configs/policy/act_restricted.yaml
  action_mode: restricted
  use_intent: false
intent:
  provider: none
benchmark:
  scenario_set: scence_construct_v1  # tasks T1-T5 (docs/requirements/scence_construct.md §4.4)
  scenarios: [t1_pick_place, t2_handover, t3_assist, t4_interrupt]
  eval_list: configs/scenario_lists/eval_v1.jsonl   # fixed eval episodes, 20 per task (seeds 100000+)
observation:
  cameras: [high, wrist, top]
  width: 256                       # recorded + rendered camera size (LIBERO-like; 128x96 made objects 2-4 px)
  height: 192
controller: configs/controller/restricted_action.yaml
data:
  repo_id: local/hri_phase1_noint
  root: outputs/datasets/hri_phase1_noint
  scenario_list: configs/scenario_lists/demo_v1.jsonl   # balanced demo episodes (scripts/generate_scenarios.py)
training:
  steps: 20000
  batch_size: 32
  num_workers: 8
  log_every: 100
  save_every: 2000
  amp: false                       # fp16 autocast gave NaN losses with ACT on the GTX 1650 (fp32 ~2 steps/s at batch 32)
  output_dir: outputs/train/foundation_baseline
