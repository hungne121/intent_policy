model: assets/scene.xml             # base robot scene (UR3e + SusGrip + table); scenarios add objects
control_hz: 20
home: [-1.062, -2.370, 1.663, -0.864, -1.571, -2.633]   # rest: TCP (0.15, 0.00, 0.85), top-down, tool yaw 0; in front of
                                    #   the base, clear of the high camera's view of the human's hands
tool_yaw_deg: 0.0                   # top-down tool yaw about world Z: 0 = fingers close along world X (the human stands
                                    #   at the robot's side, -Y, and takes objects from their free -Y face); -90 = along Y
max_joint_speed: 1.5                # [rad/s] per-joint target rate limit
max_gripper_speed: 0.12             # [m/s] finger-gap target rate limit
assisted_grasp:
  # SusGrip fingertips move on an arc and rise ~1.2 cm while closing, which rotates objects about
  # the grasp axis and makes purely frictional grasps unreliable in MuJoCo (see report). As in
  # iGibson/BEHAVIOR "assistive grasping", an object is attached to the gripper with a weld ONLY
  # when both fingers physically touch it while the gripper is commanded closed; it is released
  # as soon as the gripper is commanded open. Positioning errors still make grasps fail.
  enabled: true
  close_below: 0.03                 # [m] gripper command below which attachment may happen
  open_above: 0.05                  # [m] gripper command above which the attachment is released
