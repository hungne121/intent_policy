# PIF central config (model of docs/PIF.md). Run: python -m pif.train --config configs/pif/pif.yaml [--set k=v ...]
# The data domain, tasks, components and every parameter are chosen here; the code has no hidden defaults.
include: [configs/pif/habit.yaml, configs/pif/sim.yaml]

data:
  domain: habit             # habit | sim   (user 23/10: HABIT first, sim later)
  tasks: [S8789]            # HABIT sids (habit.tasks) or sim tasks (T1 T2 T3 T4 T4neg T5)
  test_every: 5             # per task, every 5th episode (sorted) is held out

fps: 10                     # docs/PIF.md §2: PIF at 10 Hz, time in seconds, never interpolated to 20 Hz
seq_seconds: 4.0            # input window
horizons_s: [0.5, 1.0, 2.0, 4.0]   # prediction targets

tokens:
  keypoints: [r_wrist, r_index_base, r_index_tip, l_wrist, l_index_base, l_index_tip,
              r_shoulder, r_elbow, l_shoulder, l_elbow, head]           # J = 11 (docs/PIF.md §5)
  object_types: [object, container, surface]                          # generic, no layout zone ids (docs/PIF.md §2)

augment:                    # training inputs only; the future target frames stay clean
  joint_drop: 0.1
  frame_drop: 0.05
  keypoint_noise_m: 0.005   # placeholder, to be replaced by the measured noise
  shuffle_objects: true

model:                      # docs/PIF.md §4
  d_model: 128
  encoder_layers: 2
  heads: 4
  num_relations: 8
  predictor_hidden: 256
  no_filter: false                  # ablation: belief from the current evidence only
  predictor_sees_history: false     # ablation: the predictor also gets m_t

loss:                       # docs/PIF.md §4
  temperature: {t0: 1.0, t_min: 0.1, anneal_steps: 20000}
  weights: {filter: 1.0, sigreg: 0.05, occ: 0.1, ent: 0.01, kl: 0.001}
  sigreg_slices: 1024       # LeJEPA README example (Balestriero & LeCun 2025)
  sigreg_max_samples: 1024  # SIGReg tests the embedding distribution on a random subset of the batch's vectors
                            # (all ~15k object vectors x 1024 slices x 17 points need > 1 GB of GPU memory)
  n_sample: 4               # input frames per window where all R x (K+1) codes are scored (memory of a 4 GB GPU)

v3:                         # PIF v3 core (docs/PIF.md §4, pilot §6): rational emission + exact Bayes filter. Code: pif/filter.py
  # candidate objects k of g = (robot-acts-on, k), plus "none". HABIT: by track name; sim: by token type.
  candidates: {habit: {names: [airtight container]}, sim: {types: [object, container, surface]}}
  # emission per hand: index-tip displacement N(beta sigma^2 u_k, sigma^2 I) + pointing direction (base -> tip)
  # vMF(norm(a d_{t-1} + (1 - a) v_k), kappa); the acting hand is a 1/2 : 1/2 mixture (docs/PIF.md §4.3)
  # act_prob = rho: under intent k the person acts towards k on a fraction rho of the frames, else still / retracting
  # outlier / sigma_out_m / outlier_dir: inlier-outlier mixtures for the heavy-tailed estimated keypoints (MLESAC-style)
  init: {sigma_m: 0.02, beta: 0.0, kappa: 5.0, a: 0.9, hazard: 0.01, w_none: 0.5, act_prob: 0.5,
         outlier: 0.1, sigma_out_m: 0.3, outlier_dir: 0.1}   # fit start, all learned
  fit: {steps: 300, lr: 0.05, seed: 0}       # full-batch Adam on -log p(o_1:T) (forward algorithm)

forecast:                   # ManiCast (CoRL 2023) as published: pif/forecast.py, docs/reports/PIF_survey.md
  repo: third_party/manicast           # github.com/portal-cornell/manicast branch release (cloned 2026-10-24)
  checkpoint: manicast                  # base | finetuned | manicast | manicastW | scratch (their model_checkpoints)
  checkpoint_path: null                 # our fine-tuned weights (pif/forecast_finetune.py best.pt); null: `checkpoint`
  model: {input_n: 10, output_n: 25, rate_hz: 25, st_gcnn_dropout: 0.1, n_tcnn_layers: 4, tcnn_kernel_size: [3, 3],
          tcnn_dropout: 0.0}            # their utils/parser.py defaults; 0.4 s in, 1 s out at 25 Hz
  # marker offsets in CoMaD axes (+y up, faces -z, left -x), mean over CoMaD handover_0.json (Kushal), measured
  # 2026-10-24: BackTop - mid(L/RShoulderBack), WaistLBack - mid(L/RShoulderBack)
  offsets: {backtop_minus_shoulder_mid: [0.010, 0.038, 0.013], waist_minus_shoulder_mid: [-0.095, -0.422, 0.043]}
  data:                                 # v6 sim human motion for fine-tuning (pif/v6_motion_data.py, M5 step 1)
    scenarios: [t1_choose_item, t2_fetch_return, t3_coaster_cup, t4_coworker]
    seeds: {train: [2000, 2048], val: [2048, 2054], test: [2054, 2060]}   # [a, b) per scenario, disjoint
    out: outputs/human_motion/v6_sim_motion
  finetune:                             # their recipe (third_party/manicast/src/finetune.py, utils/parser.py defaults):
    init: manicast                      #   start from the released checkpoint; Adam lr_ft 1e-4, weight decay 1e-5, 50
    lr: 1.0e-4                          #   epochs, batch 256, loss = weighted MPJPE on a batch of all windows + one of
    weight_decay: 1.0e-5                #   transition windows; wrist weight 1 (their default --weight); best epoch on val
    epochs: 50
    batch: 256
    wrist_weight: 1
    stride: 2                           # every 2nd 25 Hz window start (all windows)
    transition_after_s: 1.0             # transition window = a hand motion from its start to 1 s after its end (the
                                        #   intervals CoMaD annotates around each interaction)
    out: outputs/forecast_ft
  eval: {horizons_s: [0.5, 1.0], gate_arm_m: 0.632, moving_m: 0.05}   # moving: a wrist moves > 5 cm in 1 s; gate: wrist-shoulder > (0.186 + 0.146) x 1.90 m = invalid
                                                     # (Drillis & Contini ratios, PIF_pilot §9)

pilot:                      # docs/PIF.md §6 (pre-registered, commit 7ad563e)
  folds: 5
  bootstrap: 10000
  ece_bins: 10              # Guo, Pleiss, Sun, Weinberger 2017
  offsets_s: [-1.0, -0.5, 0.0]   # report times relative to t_leave (0 = last frame before the bread leaves the plate)
  depart_m: 0.05            # bread moved > 5 cm from its grasp position = robot left the plate (> 3x the p90 2D-3D
                            # box distance error 1.65 cm, docs/reports/PIF_P1.md)
  gru: {hidden: 64, epochs: 40, lr: 3.0e-3, seeds: [0, 1, 2]}   # baseline III (supervised)
  p4: {confidence: 0.9, inject_s: 2.0}   # report only: wrong container forced with b = 0.9, 2 s before t_leave

train:
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 32            # handoff 64; 32 fits a 4 GB GPU
  steps: 50000
  warmup: 500
  grad_clip: 1.0
  log_every: 100
  save_every: 2000
  num_workers: 2
  seed: 0
  supervised_warmstart: false        # eval labels in training only with the user's permission (handoff §6)

v6_timing:                  # M5 step 1 (docs/sim/scenarios_v6_proposal.md §7): how early is the target observable in the
                            # v6 scenarios? pif/v6_timing.py. Gesture = a human motion whose label is listed, aimed at
                            # one candidate of its set; times at 10 Hz (fps above)
  episodes: {t1_choose_item: 24, t2_fetch_return: 16, t3_coaster_cup: 24}
  seed0: 1000
  sets:                     # candidate set -> (scenario, candidate kind, gesture labels)
    t1_item:  {scenario: t1_choose_item, kind: layout, labels: [reach_object, point_object]}
    t1_tray:  {scenario: t1_choose_item, kind: place, labels: [point_place]}
    t2_hand:  {scenario: t2_fetch_return, kind: hand, labels: [reach_out, offer_back]}
    t3_spot:  {scenario: t3_coaster_cup, kind: coaster, labels: [carry_coaster]}
  thresholds: [0.7, 0.9]    # the device rules of v3.2 (early 0.7, commit 0.9; INTENT_ACT_v3.2.md §4.2e-g)
  manicast_stable_frames: 3 # ManiCast decision: the candidate nearest the forecast wrist (1 s ahead) unchanged this long
  scenario_overrides: {}    # deep-merged into every v6 scenario (diagnostics, e.g. human_behavior.motion_bank: null)
  keypoint_noise_m: 0.02    # Gaussian noise on every keypoint, as the robot's perception sees them: HABIT index-tip
                            #   step p50 ~2 cm per 0.1 s (docs/PIF.md 07:44); without it the fit collapses (sigma -> 0,
                            #   kappa -> 5e6 on exact sim keypoints: likelihood singularity, Bishop 2006 PRML §9.2.1)

v6_detection:               # M5: ManiCast's own decision protocol on v6 gestures (third_party/manicast/eval/handover.py:
                            # the forecast wrist at +1 s vs the current wrist entering the target's region); pif/v6_detection.py
  episodes: {t1_choose_item: 24, t2_fetch_return: 16, t3_coaster_cup: 24}
  seed0: 3000               # disjoint from the fine-tuning seeds (2000-2059)
  sets:                     # region: point = horizontal radius half the nearest-neighbour spacing; angle = direction of
    t1_item:  {region: angle}    #   the wrist's displacement from the gesture start (>= moving_m), half the nearest
    t1_tray:  {region: angle}    #   angular spacing seen from there (the targets are beyond reach)
    t2_hand:  {region: point}
    t3_spot:  {region: point}
  moving_m: 0.05            # forecast.eval.moving_m: a displacement below this has no direction
  still_fraction: 0.10      # 'stopped' = speed below 10 % of the gesture's peak speed (the movement-end convention of
                            #   the pointing kinematics, INTENT_ACT_v3.2.md §4.2c-d; DeviceBelief.STILL_FRACTION)
  window_s: [-0.5, 1.0]     # scored from 0.5 s before the motion start to 1 s after its end
  observers:                # forecast.checkpoint_path values (null: released `checkpoint`), plus constant velocity
    released: null

v6_goal:                    # M5: goal posterior by inverse planning on the observed + forecast hand path (pif/v6_goal.py)
                            # P(G | S->Q) ∝ exp(-C(S->Q) - C*(Q->G)) / exp(-C*(S->G)) (Legibility and predictability of
                            # robot motion - Dragan, Lee, Srinivasa - 2013; Action understanding as inverse planning -
                            # Baker, Saxe, Tenenbaum - 2009); C = beta x path length, C* = beta x straight distance, so
                            # P(G) ∝ exp(beta [d(S, G) - d(Q, G)]): the progress made towards G. Q = the forecast wrist 1 s
                            # ahead (observed only: the current wrist)
  lookback_s: 1.0           # S = the wrist 1 s ago (a person still for 1 s gives a uniform posterior)
  beta_from_error_mm: 59.0  # beta = 1 / the fine-tuned ManiCast wrist error at 1 s on transition windows (test, 18:50)
  forecast_steps: 10        # forecast read at 0.1 .. 1.0 s
  still_fraction: 0.10      # termination term: on frames where the hand is stopped (observed) / forecast to stop (its
                            #   speed at 0.9->1.0 s), speed < 10 % of the gesture's peak (movement-end convention, as
                            #   v6_detection), p(stop at Q | G) ∝ exp(-beta d_xy(Q, G)) multiplies the posterior
  pointing_sigma_deg: 4.61  # + pointing evidence: log P(G) += kappa cos(angle(index ray base->tip, tip->G)), vMF with
                            #   kappa = 1/sigma^2, sigma = the measured pointing-ray error (intent_schema.yaml cone_sigma_deg)
                            #   used only while the hand has the pointing shape (observable); otherwise the path term
                            #   (v6_goal 23:25: pointing gestures 0.29 -> 1.00 with it, reaching 1.00 -> 0.30 with it)
  episodes: {t1_choose_item: 24, t2_fetch_return: 16, t3_coaster_cup: 24}
  seed0: 3000
  sets: [t1_item, t1_tray, t2_hand, t3_spot]   # candidate sets of v6_timing
  window_s: [-0.5, 0.0]     # scored from 0.5 s before the motion start to its end
  observers: {released: null}                   # + observed only, constant velocity; add fine-tuned via --set

v6_object_forecast:         # M5: can the future position of an object the human carries be predicted? (pif/v6_object_forecast.py)
  episodes: {t2_fetch_return: 12, t3_coaster_cup: 16, t4_coworker: 12}
  seed0: 3100               # disjoint from the fine-tuning seeds
  horizons_s: [0.5, 1.0]
  moving_m: 0.05            # 'moving' frames: the object moves > 5 cm within 1 s (as forecast.eval.moving_m)
  still_fraction: 0.10      # 'stops' variant: the forecast hand speed < 10 % of the recent peak (movement-end convention)
  observers: {released: null}   # + fine-tuned via --set; held object = wrist forecast + current wrist->object offset
