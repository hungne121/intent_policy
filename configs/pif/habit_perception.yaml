# HABIT perception for PIF tokens (CORRECTIONS #7, HANDOFF_PIF_LOCAL.md §6): estimated 3D in the table frame.
# Released models used as published (no fine-tuning, no parameter tuning for a desired result):
#   RTMW whole-body 2D keypoints (Jiang, Xie, Li 2024, RTMW-l 70.2 mAP on COCO-WholeBody), rtmlib `performance`
#     (YOLOX-m person detector + RTMW 384x288, ONNX weights of OpenMMLab)
#   MoGe-2 ViT-S metric depth + intrinsics (Wang et al. 2025, NeurIPS; github.com/microsoft/MoGe, MIT), HF
#     Ruicheng/moge-2-vits-normal. Measured on S8789 (pif/perception/depth_check.py, PIF_P1 §4): adjacent-container
#     distance error median 0.9 cm, p90 2.0 cm against the robot-kinematics reference of the same session.
#     Alternative: Depth Pro (Bochkovskii et al. 2025, ICLR), HF apple/DepthPro-hf: does not fit a 4 GB GPU, not measured.
#   Grounding DINO open-set detection (Liu et al. 2024, ECCV; 52.5 AP zero-shot COCO), HF IDEA-Research/grounding-dino-tiny
camera: front_view
pose:
  mode: performance
  kpt_thr: 0.3            # MMPose demo default. NOT a working visible flag here: rtmlib returns unnormalised SimCC
                          # confidences (0.5-9.8 on S8789 ep 2700) and gives out-of-frame head / shoulders 1.1-4.4 at
                          # the image border. Visibility rule still to be decided (PIF_P1 §4)
  # COCO-WholeBody indices of tokens.keypoints (configs/pif/base.yaml): body 0 nose, 5/6 l/r shoulder, 7/8 l/r elbow,
  # 9/10 l/r wrist; left hand 91-111, right hand 112-132 (root, then 4 points per finger: index MCP = +5, tip = +8).
  # "head" = nose (the sim head token is the head proxy centre: a few cm apart, noted in the P1 report)
  index:
    r_wrist: 10
    r_index_base: 117
    r_index_tip: 120
    l_wrist: 9
    l_index_base: 96
    l_index_tip: 99
    r_shoulder: 6
    r_elbow: 8
    l_shoulder: 5
    l_elbow: 7
    head: 0
depth:
  model: Ruicheng/moge-2-vits-normal     # or apple/DepthPro-hf
  dtype: float16
  window_px: 5            # median depth in a window around a keypoint (fingertips often fall on depth edges)
table:
  frames: 5               # frames (evenly spread) whose depth is pooled to fit the table plane
  ransac_iters: 500
  inlier_m: 0.01          # point-to-plane distance of an inlier
  min_row_frac: 0.5       # only image rows below this fraction of the height (the table fills the lower half)
detect:
  model: IDEA-Research/grounding-dino-tiny
  box_threshold: 0.35     # Grounding DINO README demo defaults
  text_threshold: 0.25
  gate_m: 0.10            # a detection joins a track within this 3D distance (same label)
  core_frac: 0.3          # object depth = median over the central part of its box
  # prompt per task -> generic token type (CORRECTIONS #14); `gripper` is only used for `holding`, never a token
  prompts:
    S8789: {airtight container: container, bread roll: object, plate: surface, robot gripper: gripper}
    S8791: {airtight container: container, container lid: object, bread roll: object, baking sheet: surface,
            robot gripper: gripper}
    S6760: {circuit board: object, rack: container, tray: surface, robot gripper: gripper}
