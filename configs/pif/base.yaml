# PIF default configuration (docs/requirements/HANDOFF_PIF.md §8, updated by HANDOFF_PIF_CORRECTIONS.md).
# P1 uses `fps`, `seq_seconds`, `horizons_s`, `tokens`, `sim`, `augment`; the model / loss / optim keys are the
# handoff's starting points for P2-P3.

fps: 10                     # CORRECTIONS #6: PIF at 10 Hz, time in seconds; sim (20 fps) keeps every 2nd frame; HABIT
                            # is native 10 Hz and is never interpolated to 20 Hz (an interpolated frame uses the next one)
seq_seconds: 4.0            # input window
horizons_s: [0.5, 1.0, 2.0, 4.0]   # prediction targets (frames = round(h * fps))

tokens:
  # J = 11 (CORRECTIONS #17). Sim: pif/data/sim_replay.py KEYPOINTS. HABIT: COCO-WholeBody indices, pif/data/habit.py
  keypoints: [r_wrist, r_index_base, r_index_tip, l_wrist, l_index_base, l_index_tip,
              r_shoulder, r_elbow, l_shoulder, l_elbow, head]
  # generic object types, no layout zone ids (CORRECTIONS #14)
  object_types: [object, container, surface]

sim:
  dataset: outputs/datasets/intent_act_late_v5
  replay: outputs/pif/sim_replay/intent_act_late_v5   # pif/data/sim_replay.py --code-commit b5d0c8e
  # 543/559 episodes replay exactly; 16 T2 handovers (+T5 on T2) keep the frame count, the holding flag and the
  # keypoints (<= 7e-7) but the robot state drifts by <= 0.0036 (contact during the hand-over). Accepted below this
  # tolerance: the robot state is not a PIF input (only `holding` is, handoff B5, and it matches), and the drift is
  # below the 0.005 m keypoint noise augmentation.
  replay_state_tol: 0.005
  table_z: 0.62             # table frame = world shifted down to the table top (origin under the robot base, +X away
                            # from the robot, +Y robot's left); configs/scene/common.yaml
  shape_type: {box: object, cup: container}     # configs/scene/common.yaml objects_catalog shapes
  # visible tape markers rendered in the scene (intent_policy/sim/scene_builder.py _add_zone_markers) that are places
  # an object can be put on. H1/H2 tapes are not tokens: the handover target is the human hand (CORRECTIONS #14);
  # the small S slot crosses are not tokens: the objects standing on them are.
  surfaces: [P1, P2, U]
  surface_height_m: 0.06    # an object counts as on a surface when its centre is below this height above the table
  # eval-label keys without a token of their own (pif/data/labels.py)
  surface_alias: {U_cup: U} # U_cup has no tape (layout marker: false) and lies inside the U tape
  human_targets: [H1, H2]   # -> target "human hand"
  region_targets: [robot_zone, zone_edge, edge]   # T4 intrusion / T4neg reach next to the zone edge -> "region"

augment:                    # train inputs only; future target frames stay clean
  joint_drop: 0.1
  frame_drop: 0.05
  keypoint_noise_m: 0.005   # placeholder: to be measured (RealSense: scripts/record_real.py stats; HABIT: P1 report)
  shuffle_objects: true

# ---- P2+ (handoff §8, unchanged starting points)
d_model: 128
encoder_layers: 2
heads: 4
num_relations: 8
target_mode: sigreg
temperature: {t0: 1.0, t_min: 0.1, anneal_steps: 20000}
loss_weights: {filter: 1.0, sigreg: 0.05, occ: 0.1, ent: 0.01, kl: 0.001}
supervised_warmstart: false
factorized_search: false
task_prior: false
optim: {lr: 3.0e-4, weight_decay: 0.01, batch_size: 64, steps: 50000}
seed: 0

predictor_hidden: 256
data:                       # user 23/10: PIF on HABIT first, sim later
  domain: habit             # habit | sim
  habit_dirs: [outputs/habit/perception]
  sids: [S8789]
  habit_labels: configs/pif/habit_labels.yaml
split: {test_every: 5}      # per task, every 5th episode is held out (test)
train:                      # laptop (GTX 1650 4 GB): handoff batch 64 -> 32, L_pred on n_sample frames per window
  batch_size: 32
  n_sample: 4               # input frames per window where L_pred / w / L_filter are computed (all R x (K+1) codes)
  steps: 50000
  warmup: 500
  grad_clip: 1.0
  sigreg_slices: 1024       # LeJEPA README example
  log_every: 100
  save_every: 2000
  num_workers: 2
ablation: {no_filter: false, predictor_sees_history: false}
