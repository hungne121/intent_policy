# Shared V2 preview station (user decisions 13–14/11/2026), applied by scripts/v2_preview_common.py::apply_station
# to every V2 task so I1, I2, I3, ... share one setup.
# Robot base across the table in front of the human, translated along the object rows and set back; the arm's
# forward axis turned to face the human. (0.30, 0.33): probe 13/11 (Codex) kept the cup cluster and the coaster
# row away from the inner / outer IK limits, no elbow-straight oscillation.
robot_base_xy: [0.30, 0.33]
robot_base_yaw_deg: -90
# Human stands at the right-hand table edge facing +Y.
human_stand_xy: [0.30, -0.54]
# HY-Motion connected skin under waist / shoulder rotation (docs/reports/I1_SKIN_FIX_2026-11-13.md).
continuous_skin: true
# Overview camera: side view, robot left, human right.
camera_high: {pos: [-0.60, 0.05, 1.45], target: [0.34, 0.02, 0.74], fovy: 62}
# Human model: 'v3' = 22-joint articulated mannequin with collision capsules and a connected skin (06/TTr-DL);
# 'v2' = the former 9-segment mannequin.
human_model: v3
# No safety wrapper (user, 14/11 21:10): stopping for the person is a deliberate expert action that the policy must
# learn, never an external override. Experts call `goto(..., keep_clear=...)` where they decide to wait for the hand;
# the scaffold only MEASURES robot-human proximity contacts (within this margin) and real penetrations.
proximity_margin_m: 0.03
expert_keep_clear_m: 0.04
# Second overview camera behind the robot base, looking forward at the person (user, 15/11 18:57); recorded when
# PREVIEW_CAMERA=back (previews) or as back.mp4 by the I3 collector.
camera_back: {pos: [0.30, 1.05, 1.30], target: [0.30, -0.30, 0.72], fovy: 60}
