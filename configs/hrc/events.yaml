        (mj_objectVelocity, body CoM) <= grasp_gap_m / close_s, all for rest_ticks consecutive physics ticks.
        State (i) (robot still holds it, 1.1 rule) unchanged. Task spec: docs/intent_act/KICH_BAN_10_TASK.md C4
