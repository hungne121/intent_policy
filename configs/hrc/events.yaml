# Human-facing event detector (09/QĐ-KT P0) + scoring-only metric events (10/11/QĐ-KT). Read by intent_policy/shared/events.py.
# Detector version below (= events.DETECTOR_VERSION); bump it on ANY change of a definition / parameter (11/QĐ-KT).
version: hrc-events-1.2
changelog:
