# Versioned evaluation protocol for Phase 2 (oracle intention utility). Every condition and every
# training seed is evaluated on exactly these splits / seeds; scenario configs are the experiment's
# (twin pairs => consecutive seeds share the layout and differ only in the human's choice).
protocol: hri_phase2_v1
splits:
  - name: nominal
    scenarios: [instructor_object_to_target, collaborator_object_handover, collaborator_bowl_assistance,
                intruder_pick_place_interruption]
    seed_start: 100000
    episodes_per_scenario: 30
  - name: intention_change
    scenarios: [collaborator_object_handover, instructor_object_to_target]
    seed_start: 110000
    episodes_per_scenario: 30
    scenario_overrides:
      all:
        intention_change: {probability: 1.0}
# Inference setting, fixed before any Phase-2 evaluation. ACT temporal ensembling weights exp(-m*i), i=0
# oldest; m chosen on held-out tuning seeds 200000+ (8/scenario, Phase-1 checkpoint): max total CSR, ties by
# fewer safety failures. m=-0.1 and m=-0.2 both 27/32; m=-0.2 had one intruder contact (HCS 0.875), so -0.1.
# Grid and per-scenario results: outputs/eval/tuning_te/.
inference:
  temporal_ensemble_coeff: -0.1
# Oracle conditions (evaluation-time; the No-Information policy is the capacity-matched masked checkpoint).
conditions:
  correct: {condition: correct}
  wrong: {condition: wrong, displacement_m: 0.2, reverse_motion: true}
  shuffled: {condition: shuffled, rng_seed: 0}
  noisy: {condition: noisy, sigma_pos_m: 0.05, sigma_vel_m_s: 0.1, flip_prob: 0.2}
  delay_100ms: {condition: delayed, delay_s: 0.1}
  delay_200ms: {condition: delayed, delay_s: 0.2}
  delay_500ms: {condition: delayed, delay_s: 0.5}
  lead_100ms: {condition: lead, lead_s: 0.1}
  lead_200ms: {condition: lead, lead_s: 0.2}
# Pre-registered pass criteria (evaluated by scripts/analyze_phase2.py).
pass_criteria:
  primary_metrics: [CSR, CT, AM, WCR, TSync, Rsp, CRsp]   # "important downstream interaction metrics"
  safety_metrics: [CFR, HCS]                               # must not get worse
  alpha: 0.05
  ir_alone_is_not_gain: true
