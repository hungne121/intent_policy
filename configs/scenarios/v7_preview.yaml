# PREVIEW CŨ: nội dung task mới nhất ở docs/PIF.md §8.2 (28/10/2026). C3/C4 và các diễn biến cần dựng lại.
# Kinematic storyboard of the v7 candidate tasks, revised for review (https://claude.ai/artifact/TNBrZ2xjRDEPjcej5TQGGK,
# user 27/10/2026), one episode per task, rendered by
#   scripts/preview_scenarios_v6.py --config configs/scenarios/v7_preview.yaml
# CANDIDATES NOT VALIDATED: no physics, no expert, no intent model; the human palms (right `human`, left `human_l` for
# two-handed actions), the robot TCP and every held object follow the hand-written timelines below (min-jerk between
# keyframes, robot by IK). Format: configs/scenarios/v6_preview.yaml, plus
#   objects: shape mesh (assets/objects/gso/<mesh>/, base on z = 0; `scale`, `yaw` deg) | frame (box with coloured faces
#            + a socket on top of each side; `half`, `faces`: colours of the local +y, -x, -y, +x sides)
#   events: {grab: X, by: robot | human | human_l | <object>}  (by an object: X moves with it, in its frame)
#   spin:   {t: [t0, t1], obj: X, yaw: deg}  (turns X about z)
# World frame of configs/scene/common.yaml: robot base at the origin, table top z 0.62, human at (0.30, -0.48) facing
# +Y (the human's right = +X), right hand rest (0.49, -0.40, 0.66). Robot reach R_eff 0.43 m (configs/layout.yaml).
scene_base: configs/scene/common.yaml
out_dir: outputs/scenario_v7_preview
fps: 20
video: {width: 480, height: 360, caption_h: 104, font: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf, font_size: 15}
cameras:
  high: {pos: [0.30, 0.70, 1.50], target: [0.30, -0.20, 0.90], fovy: 70}       # common.yaml: from the robot side
  side: {pos: [1.25, -0.10, 1.30], target: [0.28, -0.04, 0.72], fovy: 55}       # from the human's right
show: [high, side]
colors:
  red: [0.85, 0.15, 0.12, 1.0]
  blue: [0.15, 0.35, 0.90, 1.0]
  green: [0.10, 0.70, 0.25, 1.0]
