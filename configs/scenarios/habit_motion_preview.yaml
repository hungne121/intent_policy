# HABIT-inspired, single-UR3e storyboards for review, 2026-10-28.
# Timelines are hand-authored: no physics, human-forecast model or learned policy is run.
# Sources: https://huggingface.co/datasets/configinc/HABIT/tree/main/task_details
# S6002 and S8355 are adapted from two robot arms to one; see docs/PIF.md.
scene_base: configs/scene/common.yaml
out_dir: outputs/habit_motion_preview
fps: 20
video: {width: 480, height: 360, caption_h: 104, font: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf, font_size: 15}
cameras:
  high: {pos: [0.30, 0.70, 1.50], target: [0.30, -0.20, 0.90], fovy: 70}
  side: {pos: [1.25, -0.10, 1.30], target: [0.28, -0.04, 0.72], fovy: 55}
show: [high, side]
colors:
  red: [0.82, 0.12, 0.10, 1.0]
  blue: [0.10, 0.28, 0.78, 1.0]
  green: [0.12, 0.60, 0.30, 1.0]
