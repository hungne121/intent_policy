scenario_id: t2_handover
task_code: T2                       # docs/requirements/scence_construct.md §4.4
role: collaborator
goal: >-
  Three objects (cubes and/or cups) stand on 3 of the 6 slots S1-S6; in 1/3 of the episodes an identical pair
  (B1 + B1' or C1 + C2) is on the table and the target is one of them. The human points at the target object and
  holds an open hand out, palm up, in a hand zone H, early (before the robot grasps), on time (as the robot
  finishes the grasp) or late (the robot holds the object and waits 2-5 s). The robot must put exactly that object
  into the waiting palm, hold still and release only when the human has closed the hand on it and pulls it.
task: Pick up the object the human points at and hand it to the human's waiting hand.
seed: 0
scene:
  base: ../scene/common.yaml
  objects: [B1, B2, B3, B1p, C1, C2, C3]
scene_variation:
  n_objects: 3
  pair_probability: 0.333
  cup_target_probability: 0.5       # target kind in episodes without an identical pair
  timings: [early, on_time, late]
  object_jitter_m: 0.008
  object_yaw_rad: 0.2
  robot_home_jitter_rad: 0.04
human_behavior:
  type: t2_receiver
  cue_onset_s: [0.4, 1.2]
  point_s: [1.0, 1.3]
  point_dwell_s: [0.3, 0.6]         # minimum hold after the pointing arrived (2026-10-03, was 1.8-2.5) ...
  rest_s: [0.9, 1.2]
  point_hold_max_s: 6.0             # ... then kept until the robot's hand is above the target, at most this (user 2026-10-03)
  point_length_m: 0.50
  speed_scale: [0.8, 1.25]
  reach_out_s: [1.0, 1.4]           # the open hand moves to the hand zone (palm centre at the zone's height above the
                                    #   table), palm up and level
  late_wait_s: [2.0, 5.0]           # late: the hand arrives this long after the robot has lifted the object
  reach_delay_s: [0.0, 6.0]         # (2026-10-03) free timing, replaces early / on_time / late: the hand is held out
                                    #   this long after the pointing ends, whatever the robot is doing ...
  lower_first_prob: 0.5             # ... after lowering the pointing hand to rest first (else straight from pointing)
  palm_surface_m: 0.032             # palm surface above the palm centre (level, upturned hand; measured on the mesh)
  present_offset: [0.0, 0.015, 0.045] # the robot lowers the object into the palm and holds it still here (w.r.t. the
                                    #   palm centre, + half height): 1.5 cm towards the fingers (away from the wrist),
                                    #   its bottom 1.3 cm above the palm surface (a cube's gripper fingertips reach 2 mm
                                    #   above its bottom and keep the 1 cm violation distance, +-5 mm set-point grid)
  accept_radius_m: 0.02             # object within this distance of that point ...
  accept_still_s: 0.3               # ... with the robot still for this long => the human takes it:
  take_s: 0.4                       # the palm rises under the object and the fingers close around it ...
  take_gap_m: 0.003                 # ... until its bottom is this far above the palm surface (the object is in the palm)
  hand_clearance_m: 0.005           # the rising palm stops if the robot is closer than this
  pull_offset: [0.0, -0.04, -0.03]  # then the human pulls the object down, towards the body ...
  pull_s: 0.6                       # ... the robot must release on the pull (fixed release condition)
intention_change:
  probability: 0.0
  late_trigger_m: 0.15
  withdraw_s: [1.0, 1.3]
  pause_s: [0.4, 0.7]               # pause at rest before pointing at the new target
  early_dwell_s: [0.7, 1.0]         # early change: the first pointing is held this long, then withdrawn
  # (2026-10-03) free timing, replaces early / late and late_trigger_m: the change of mind comes a random time after
  # the first indication completed, whatever the robot is doing (heading for, lowering to, holding or carrying the old
  # target); T1 / T2 first signal 'wait' (open hand, palm down, held out towards the robot), then point at the twin
  delay_s: [0.3, 6.0]
  stop_s: [0.4, 0.6]                # the 'wait' hand moves out ...
  stop_hold_s: [0.4, 0.8]           # ... and is held this long
expert:
  trigger: cue_complete
  travel_dz: 0.20                   # cups are carried by the rim: travel high enough to clear the other cups
  staging_offset: [0.0, 0.14]       # holds the object here (x, y w.r.t. the centre of the hand zones) until a hand is
                                    #   out, at the height it crosses the open fingers at (expert HANDOVER_DZ)
timing:
  timeout_s: 60.0
  stable_s: 0.5
success_conditions:
  other_object_moved_max_m: 0.02
safety_constraints:
  forbid_human_contact: true
  violation_distance_m: 0.01        # handover requires proximity: only near-contact while moving counts
protocol_steps: [target_indicated, object_grasped, hand_ready, robot_at_handover, object_transferred]
applicable_metrics: [CSR, CT, IR, TSync, Rsp, OC, CFR, HCS, AM, WCR, WCD, CRsp]
metric_params:
  rsp_trigger: {event_type: protocol_step_complete, step: target_indicated}
  rsp_response: robot_motion_start
  ir_start: {event_type: protocol_step_complete, step: target_indicated}
  tsync_human: {event_type: interaction_window_start, kind: handover}
  tsync_robot: {event_type: protocol_step_complete, step: robot_at_handover}
  am_cue_complete: {event_type: protocol_step_complete, step: target_indicated}
  commit_stage: object
