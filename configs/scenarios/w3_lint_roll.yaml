# v10 W3 (docs/PIF.md §8.12 "5 task bổ sung theo HABIT", 01/11/2026; HABIT S7236 'Lint Rolling' Coworker adapted):
# two trays side by side in the shared area; the human takes them, one at a time and in an order of their own, with
# both hands to their side of the table and works there; the robot cleans each place once the tray and the hands have
# left it. Prototype for the v9 G3 gate (Cowork metrics, G4): design values, to be checked by pilots before collection.
scenario_id: w3_lint_roll
task_code: T3
role: cowork
goal: The human takes the two trays away one at a time; the robot cleans where each stood, without getting in the way.
task: Clean the places the trays leave, without getting in the person's way, then return to rest.
seed: 0
scene:
  base: ../scene/common.yaml
  grasp_attach_substep: true
  grasp_hold_squeeze_m: 0.0
  human:
    hand_mesh_mode: compiled_variants
    held_object_frame: hand
  objects:
    TA: {shape: box, size: [0.10, 0.05, 0.008], color: tray, mass: 0.3, friction: '2.0 0.1 0.001', label: tray A (20 x 10 cm)}
    TB: {shape: box, size: [0.10, 0.05, 0.008], color: tray2, mass: 0.3, friction: '2.0 0.1 0.001', label: tray B (20 x 10 cm)}
  zone_markers: false
  decor:                            # the places to clean under the trays (thin pads)
  - {name: PAD_A, type: box, xy: [0.19, -0.08], size: [0.10, 0.05, 0.001], color: box}
  - {name: PAD_B, type: box, xy: [0.41, -0.08], size: [0.10, 0.05, 0.001], color: box}
scene_variation:
  variant: coaster                  # spec / human generator of the v6 coaster task (overridden below)
  cup: TA
  coaster: TB
  object_jitter_m: 0.0
  object_yaw_rad: 0.0
  robot_home_jitter_rad: 0.04
  w3:
    trays: [TA, TB]                 # tray i on pad i
    pads: {PAD_A: [0.19, -0.08], PAD_B: [0.41, -0.08]}   # 2 cm apart; robot reach to the centres <= 0.42 < R_eff 0.43
    dest: {TA: [0.19, -0.25], TB: [0.41, -0.25]}         # pulled straight to the human's side (W2 spots at y -0.20)
    jitter_m: 0.008
    first_pause_s: [0.5, 1.5]
    work_s: [2.0, 4.0]              # own work at the tray before taking the next (design range)
  c2:
    pad_half_m: 0.07                # the TCP this close (per axis) over a pad's centre counts as wiping
    restore_m: 0.07
    wipe_z_max_m: 0.035
    wipe_path_m: 0.20               # strokes clipped to the reach on the far place (4 x ~7 cm)
human_behavior:
  type: t3_coaster
  cue_onset_s: [0.4, 1.5]
  take_reach_s: [0.8, 1.2]
  carry_s: [0.9, 1.3]
  lower_s: [0.4, 0.6]
  carry_height_m: 0.08
  hands_apart_m: 0.18               # both hands near the tray's ends
  grip_offset_xy: [0.09, 0.0]       # the right palm over the tray's right end (the human's right = +x)
  grip_dz_m: 0.094                  # as W2: 'grasp' hand 85.3 mm below the palm + tray half thickness 8 mm
  clear_m: 0.12                     # the robot cleans once the tray and both hands are this far from the place
  spot_jitter_m: 0.0
  point_s: [1.0, 1.0]
  point_dwell_s: [0.3, 0.5]
  rest_s: [0.9, 1.2]
  speed_scale: [0.8, 1.25]
  motion_bank:
    folder: outputs/human_motion/hymotion_ten_tasks_2026-10-30/hymotion_out
    split_manifest: outputs/human_motion/hymotion_ten_tasks_2026-10-30/splits.json
    split: train
    min_dist_m: 0.08
    min_cos: 0.3
    extent_ratio: [0.4, 2.5]
    table_edge_y: -0.36
    table_margin_m: 0.03
    holding_margin_m: 0.08
    robot_clear_m: 0.15
    max_dev_ratio: 0.25
    labels:
      reach_tray: ['*']
      lift_tray: ['*']
      carry_tray: ['*']
      lower_tray: ['*']
      withdraw: ['*']
  hand_clearance: {window_s: 0.25, iterations: 3}
  yield_to_robot: {max_wait_s: 3.0, lookahead_s: 0.25, wait_for_bank: true, before_start: false}   # v9 G1
intention_change:
  probability: 0.0
  late_trigger_m: 0.15
expert:
  rule: observed
  travel_dz: 0.15
  decision:                         # docs/PIF.md §8.12 "Công thức quyết định và phục hồi" (both rules, only the input differs)
    sigma_m: 0.0795                 # alpha = 1 / sigma: ManiCast wrist error at 1 s on transitions (outputs/forecast_ft/2026-10-31_08-42)
    beta: 1.0                       # heading weight (Fang et al. 2026)
    still_speed: 0.01               # m/s: below it a hand counts as still (heading term 0); the mannequin at rest does not drift
    velocity_window_s: 0.2          # the seen wrist velocity over this window
    tau: 0.5                        # commit threshold on the group belief (Fang et al. 2026: 0.5), calibrated per rule below
    eps: 0.10                       # target rate of wrong commitments (design value, no source)
    eta: 0.05                       # Conformal Decision Theory step (Lekeufack et al. 2024)
  staging_offset: [0.0, 0.20]       # waiting point: between the places, 20 cm towards the robot (v9 G2)
  reach_m: 0.42                     # stroke ends within R_eff 0.43 (configs/layout.yaml) - 1 cm
  standoff_offset: [0.0, 0.16]      # wait 16 cm beyond the section (robot side) until it is clear, not over it
  wipe_dz: 0.02
  stroke_m: 0.06                    # strokes +-6 cm along the place ...
  strokes: 4                        # ... 4 x 12 cm = 0.48 m > wipe_path_m
  yield_while_wiping: true          # Cowork: separation monitoring also while cleaning (the human reaches past the robot) ...
  yield_distance_m: 0.08            # ... and the robot rises once any human body proxy is this close to it ...
  yield_rise_m: 0.10                # ... to this far above its travel height (design values)
  conflict_m: 0.14
  conflict_z_m: 0.25
  wait_xy: [0.30, 0.12]
timing:
  timeout_s: 90
  stable_s: 0.5
success_conditions:
  object_speed_max: 0.04
  other_object_moved_max_m: 0.02
  rest_tolerance_m: 0.04
safety_constraints:
  forbid_human_contact: true
protocol_steps: [robot_at_rest]
applicable_metrics: [CSR, CT]
metric_params: {}
