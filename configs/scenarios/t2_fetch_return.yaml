scenario_id: t2_fetch_return
task_code: T2                       # v6 (docs/sim/scenarios_v6_proposal.md, approved 2026-10-24); HABIT 'Retrieve and
role: collaborator                  #   hand over the desired beverage to the person' (S7045), give-back as in S6760
goal: >-
  A can stands on one of the slots, the human works on a piece in U. When the work is done (the last strokes are
  slower) the human holds the open hand out, palm up, at a hand zone plus an offset; the robot must put the can into
  that hand (released only when the human pulls). The human uses it, then holds it out again (another hand zone plus
  an offset); the robot must take it back, put it back on its slot and return to rest. There is one object: when
  (the progress of the work) and where (the open hand) are the intention.
task: Hand the person the can when they need it, take it back when they give it back, put it back.
seed: 0
scene:
  base: ../scene/common.yaml
  objects: [CAN, WP]
  zone_markers: false
scene_variation:
  variant: fetch_return
  object: CAN
  work_piece: WP
  object_jitter_m: 0.008
  object_yaw_rad: 0.2
  robot_home_jitter_rad: 0.04
human_behavior:
  type: t2_worker
  cue_onset_s: [0.2, 0.6]           # the work starts (strokes over the piece)
  strokes: [3, 6]                   # provisional, to be measured on HABIT S7045 (TODO): number of strokes ...
  stroke_s: [0.5, 0.8]              # ... the duration of one ...
  finish_strokes: 2                 # ... the last ones slower (the work is finishing) ...
  finish_slowdown: 1.4              # ... each this much longer than the one before
  stroke_m: 0.06                    # hand travel of a stroke over the piece
  work_height_m: 0.04               # palm above the piece centre while working
  reach_out_s: [1.0, 1.4]           # the open hand goes out (provisional, measure on S7045)
  hand_jitter_m: 0.02               # the open hand within this (x, y) of the hand zone centre (reach: see CAN)
  use_offset: [-0.08, 0.04, 0.16]   # the can is used here, w.r.t. the hand rest pose
  use_move_s: [0.8, 1.1]
  use_s: [1.0, 2.5]
  back_s: [1.0, 1.4]                # the can is held out again ...
  return_dz_m: 0.0                  # ... at the receiving palm's height (higher puts the robot's grasp of it out of
                                    #   reach at H2: setpoint stuck 3 cm short, check 2026-10-24 17:01)
  reaction_s: 0.213                 # the human lets go after a simple visual reaction time (Woods et al. 2015, as T2)
  point_s: [1.0, 1.0]               # (drawn for every task, unused: no pointing in v6 T2)
  point_dwell_s: [0.3, 0.5]
  rest_s: [0.9, 1.2]
  speed_scale: [0.8, 1.25]
  palm_surface_m: 0.032             # palm surface above the palm centre (level, upturned hand; measured on the mesh)
  present_offset: [0.0, 0.015, 0.045] # the robot lowers the object into the palm and holds it still here (w.r.t. the
                                    #   palm centre, + half height): 1.5 cm towards the fingers (away from the wrist),
                                    #   its bottom 1.3 cm above the palm surface (a cube's gripper fingertips reach 2 mm
                                    #   above its bottom and keep the 1 cm violation distance, +-5 mm set-point grid)
  accept_radius_m: 0.02             # object within this distance of that point ...
  accept_still_s: 0.3               # ... with the robot still for this long => the human takes it:
  take_s: 0.4                       # the palm rises under the object and the fingers close around it ...
  take_gap_m: 0.003                 # ... until its bottom is this far above the palm surface (the object is in the palm)
  hand_clearance_m: 0.005           # the rising palm stops if the robot is closer than this
  pull_offset: [0.0, -0.04, -0.03]  # then the human pulls the object down, towards the body ...
  pull_s: 0.6                       # ... the robot must release on the pull (fixed release condition)
intention_change:
  probability: 0.0
  late_trigger_m: 0.15
expert:
  trigger: cue_complete             # until the v6 measuring device exists (M5)
  travel_dz: 0.13
  staging_offset: [0.0, 0.14]       # as T2
timing:
  timeout_s: 60.0
  stable_s: 0.5
success_conditions:
  put_back_max_m: 0.03            # the can back within this (x, y) of where it stood
  other_object_moved_max_m: 0.02
safety_constraints:
  forbid_human_contact: true
  violation_distance_m: 0.01        # handover requires proximity: only near-contact while moving counts
protocol_steps: [work_finishing, work_done, object_grasped, hand_ready, robot_at_handover, object_transferred,
                 return_offered, object_taken_back, object_returned, object_put_back, robot_at_rest]
applicable_metrics: [CSR, CT, IR, TSync, Rsp, OC, CFR, HCS, AM, WCR, WCD, CRsp]
metric_params:
  rsp_trigger: {event_type: protocol_step_complete, step: work_done}
  rsp_response: robot_motion_start
  ir_start: {event_type: protocol_step_complete, step: hand_ready}
  tsync_human: {event_type: interaction_window_start, kind: handover}
  tsync_robot: {event_type: protocol_step_complete, step: robot_at_handover}
  am_cue_complete: {event_type: protocol_step_complete, step: hand_ready}
  commit_stage: region
