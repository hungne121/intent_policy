# Kinematic storyboard of the proposed T1-T5 v6 scenarios (docs/sim/scenarios_v6_proposal.md), rendered by
# scripts/preview_scenarios_v6.py. NOT the scenario implementation: no physics, no expert, no intent model. The human
# palm, the robot TCP and every held object follow the hand-written timelines below (min-jerk between keyframes,
# robot by IK), so the user can judge the scripts before any code is written. Times in s, positions in the world
# frame of configs/scene/common.yaml (robot base at the origin, table top z 0.62, human at (0.30, -0.48) facing +Y).
#
# Timeline entries
#   human: {t: [t0, t1], to: target, shape: relaxed|point|grasp|offer, palm_up: 0..1, point_at: target}
#   robot: {t: [t0, t1], to: target, grip: gap [m] (0.085 open)}        (omit `to` to keep the TCP still)
#   events: {t, grab: object, by: robot|human}  /  {t, drop: object, at: [x, y, z]}   (object centre)
#   target = [x, y, z]  or  {obj: key, d: [dx, dy, dz]} (that object's centre when the step starts, plus d)
#   marks: shown on the timeline bar (who: human | robot);  captions: [t0, t1, text]
scene_base: configs/scene/common.yaml
fps: 20
video: {width: 480, height: 360, caption_h: 104, font: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf, font_size: 15}
cameras:
  high: {pos: [0.30, 0.70, 1.50], target: [0.30, -0.20, 0.90], fovy: 70}       # common.yaml: from the robot side
  side: {pos: [1.25, -0.10, 1.30], target: [0.28, -0.04, 0.72], fovy: 55}       # from the human's right
show: [high, side]
colors:
  pink: [0.95, 0.55, 0.70, 1.0]
  brown: [0.50, 0.30, 0.14, 1.0]
  yellow: [0.98, 0.78, 0.08, 1.0]
  tan: [0.86, 0.66, 0.40, 1.0]
  red: [0.85, 0.15, 0.12, 1.0]
  blue: [0.15, 0.35, 0.90, 1.0]
  green: [0.10, 0.70, 0.25, 1.0]
  white: [0.93, 0.93, 0.93, 1.0]
  orange: [0.98, 0.50, 0.08, 1.0]
  cork: [0.62, 0.45, 0.28, 1.0]
  tray: [0.70, 0.82, 0.95, 1.0]
  tray2: [0.82, 0.82, 0.85, 1.0]
  sheet: [0.55, 0.55, 0.58, 1.0]
  box: [0.92, 0.92, 0.95, 0.55]
  lid: [0.30, 0.55, 0.85, 0.9]

