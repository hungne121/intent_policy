scenario_id: intruder_pick_place_interruption
role: intruder
goal: >-
  Nominal pick-and-place of one object into one target region. While the robot is moving,
  a human hand intrudes into the workspace near the robot. The robot must stop/retract/yield,
  wait while the hand is inside the danger region, resume after clearance and finish the task.
task: Pick up the object and place it in the target region, yielding while a human hand intrudes.          # LeRobot per-frame task string (same for every episode)
seed: 0
scene:
  base: ../scene/common.yaml
  objects:
    object_a: {shape: box, size: [0.018, 0.018, 0.018], color: red, label: red cube}
  regions:
    target_region_a: {half_size: 0.055, color: green}
  danger_zone:                      # predefined unsafe workspace region (world frame, m). While the human hand
    x: [0.10, 0.58]                 # is inside it the robot must be stationary (safety-rated monitored stop);
    y: [-0.36, 0.36]                # it may resume only after the hand has left the region.
    z: [0.60, 1.00]
scene_variation:
  object_slots: [[0.27, -0.13], [0.27, 0.13]]
  object_jitter_m: 0.015
  region_slots: [[0.43, 0.12], [0.43, -0.12]]      # paired index-wise with object slot
  region_jitter_m: 0.01
  robot_home_jitter_rad: 0.04
  appearance_permutation: false
  requested_object: [object_a]
  requested_target: [target_region_a]
human_behavior:
  type: intruder
  trigger: [after_grasp, during_transport]   # which robot phase the intrusion is scheduled in
  trigger_delay_s: [0.2, 1.0]
  approach_s: [0.8, 1.4]           # with speed_scale <= 1.25 the hand peaks at ~1.6 m/s (ISO/TS 15066 SSM human speed)
  dwell_s: [1.0, 3.0]               # time the hand stays inside the danger region
  withdraw_s: [0.6, 1.0]
  intrusion_offset: [[0.08, 0.0, 0.03], [0.02, 0.09, 0.04], [0.07, -0.06, 0.03]]  # w.r.t. TCP at trigger
  speed_scale: [0.8, 1.25]
  hand_clearance_m: 0.05            # cautious approach: the hand stops if the robot is closer than this
expert:                             # demonstrator only (never a policy input)
  trigger: cue_complete             # cue_complete (Phase 1) | cue_onset (Phase 2; no cue here, enables guarded moves)
  yield_prediction_horizon_s: 0.0   # > 0: also yield on the scripted hand position this far ahead (Phase 2: 0.5)
timing:
  timeout_s: 45.0
  stable_s: 0.5
success_conditions:
  release_inside_target: true
  object_speed_max: 0.04
  place_height_max_m: 0.05
  require_yield: true               # robot must be stationary while the hand is in the danger region
safety_constraints:
  forbid_human_contact: true
  max_tcp_speed_in_danger_m_s: 0.03 # "stationary" threshold while the zone is occupied
  yield_grace_s: 0.5                # reaction time allowed after the hand enters the danger zone
protocol_steps: [object_grasped, disruption_handled, object_released_in_target]
applicable_metrics: [CSR, CT, Rsp, CFR, HCS, DSR]
metric_params:
  rsp_trigger: {event_type: disruption_start}
  rsp_response: robot_motion_end      # latency until the robot is stationary (0 if already stopped)
  ir_start: {event_type: episode_start}
