scenario_id: t3_coaster_cup
task_code: T3                       # v6 (docs/sim/scenarios_v6_proposal.md, approved 2026-10-24); HABIT 'Place
role: collaborator                  #   coasters on the table and set cups on them' (S8165)
goal: >-
  A cup stands on one of the robot-zone slots, a coaster lies in U in front of the human. The human takes the coaster
  and puts it down at a spot of their choice in the shared area (K1, K2 or K3, plus a small offset). The robot must
  stand the cup on that coaster without touching the human or moving the coaster, then return to rest. The spot is
  the intention and the carrying motion reveals it: an early robot carries the cup towards where the coaster is going.
task: Stand the cup on the coaster the person puts down, then return to rest.
seed: 0
scene:
  base: ../scene/common.yaml
  objects: [C1, CO1]
  zone_markers: false
scene_variation:
  variant: coaster                  # spec: the cup on a random slot, the coaster in U, a random spot K1-K3
  cup: C1
  coaster: CO1
  object_jitter_m: 0.008
  object_yaw_rad: 0.2
  robot_home_jitter_rad: 0.04
human_behavior:
  type: t3_coaster
  cue_onset_s: [0.4, 1.2]           # the reach for the coaster starts
  take_reach_s: [0.8, 1.2]          # provisional, to be measured on HABIT S8165 (TODO): reach to the coaster ...
  carry_s: [1.0, 1.5]               # ... carry it to above the spot ...
  lower_s: [0.4, 0.6]               # ... and put it down
  carry_height_m: 0.05              # the coaster is carried this high above its place, then lowered
  grip_dz_m: 0.03                   # palm centre above the coaster centre while holding it
  spot_jitter_m: 0.02               # the coaster lands within this (x, y) of the spot centre
  point_s: [1.0, 1.0]               # (drawn for every task, unused: no pointing in v6 T3)
  point_dwell_s: [0.3, 0.5]
  rest_s: [0.9, 1.2]
  speed_scale: [0.8, 1.25]
  motion_bank:                      # generated hand motions (HY-Motion 1.0-Lite library, configs/human_motion/hymotion_v6.yaml,
                                    #   sim/motion_bank.py): these motion labels use a library motion of the listed kinds
    folder: outputs/human_motion/hymotion_v6_2026-10-24
    min_dist_m: 0.08                # shorter moves keep the minimum-jerk line
    min_cos: 0.3                    # the library motion heads within ~72 deg of the needed direction (horizontal) ...
    extent_ratio: [0.4, 2.5]        # ... and its extent is comparable to the needed distance
    table_edge_y: -0.36             # configs/layout.yaml table y min (the human's edge)
    table_margin_m: 0.03            # the palm stays this far above the table top
    holding_margin_m: 0.08          # ... this far while holding something (it hangs ~3 cm below the palm)
    robot_clear_m: 0.15             # a library motion passing closer to the robot (along its links) is not used
    max_dev_ratio: 0.25             # ... nor one straying from the straight line by more than this x the distance:
                                    #   human hand paths are nearly straight, slightly curved (Spatial control of arm
                                    #   movements - Morasso - 1981; Kinematic features of unrestrained vertical arm
                                    #   movements - Atkeson, Hollerbach - 1985)
    labels:
      reach_coaster: [t3_*, t4_reach_near]
      carry_coaster: [t3_*]
      withdraw: [t3_*, t4_put_down, idle_*]
intention_change:
  probability: 0.0
  late_trigger_m: 0.15
expert:
  trigger: cue_complete             # until the v6 measuring device exists (M5); cue_onset (clairvoyant) fails
                                    #   T5 changes of mind in the old T1 too (6/12, check 2026-10-24 16:52)
  travel_dz: 0.20                   # the cup (8.5 cm) is carried above the 15 cm hand height of the old T3
timing:
  timeout_s: 45.0
  stable_s: 0.5
success_conditions:
  on_coaster_xy_m: 0.02             # cup centre within this of the coaster centre (coaster radius 4.5 cm, cup 3.6 cm)
  object_speed_max: 0.04
  other_object_moved_max_m: 0.02
  rest_tolerance_m: 0.04
safety_constraints:
  forbid_human_contact: true
protocol_steps: [coaster_taken, cup_grasped, coaster_placed, cup_on_coaster, robot_at_rest]
applicable_metrics: [CSR, CT, IR, TSync, Rsp, OC, AM, WCR, WCD, CRsp]
metric_params:
  rsp_trigger: {event_type: protocol_step_complete, step: coaster_taken}
  rsp_response: robot_motion_start
  ir_start: {event_type: protocol_step_complete, step: coaster_placed}
  tsync_human: {event_type: protocol_step_complete, step: coaster_placed}
  tsync_robot: {event_type: protocol_step_complete, step: cup_on_coaster}
  am_cue_complete: {event_type: protocol_step_complete, step: coaster_placed}
  commit_stage: region
