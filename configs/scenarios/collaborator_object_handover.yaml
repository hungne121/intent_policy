scenario_id: collaborator_object_handover
role: collaborator
goal: >-
  The human selects one of two objects (indicates it by hovering the hand above it). The
  robot must pick that object and hand it over at the human's hand; transfer completes when
  the robot releases while the human hand holds the object.
task: Pick up the object the human selects and hand it over to the human.          # LeRobot per-frame task string (same for every episode)
seed: 0
scene:
  base: ../scene/common.yaml
  objects:
    object_a: {shape: box, size: [0.018, 0.018, 0.018], color: red, label: red cube}
    object_b: {shape: cylinder, size: [0.02, 0.018], color: blue, label: blue cylinder}
scene_variation:
  object_slots: [[0.28, -0.12], [0.28, 0.12]]
  object_jitter_m: 0.015
  robot_home_jitter_rad: 0.04
  appearance_permutation: false
  selected_object: [object_a, object_b]
human_behavior:
  type: handover_receiver
  cue_onset_s: [0.4, 1.5]           # hand starts moving to the selected object
  reach_s: [1.0, 1.6]
  indicate_offset: [0.15, 0.0, 0.12] # hand hovers here w.r.t. the selected object (points from a distance)
  withdraw_offset: [0.14, 0.0, 0.05] # after the robot lifts the object: first pull the hand back ...
  receive_pose: [0.52, 0.0, 0.78]   # nominal palm position while waiting (UR3e reach-limited)
  receive_jitter_m: 0.03
  receive_move_s: [1.0, 1.8]
  speed_scale: [0.8, 1.25]
  handover_offset: [-0.09, 0.0, 0.0] # where the human expects the object, w.r.t. the palm
  robot_wait_offset: [-0.20, 0.0, 0.0] # expert demonstrator waits here (w.r.t. the palm) until the human is ready
  accept_radius_m: 0.12             # object presented within this distance of the palm ...
  accept_still_s: 0.3               # ... and the robot still for this long => human takes it
  grasp_offset: [0.07, 0.0, 0.0]    # palm position w.r.t. the object when taking it
  final_reach_s: 0.5
  hand_clearance_m: 0.008           # cautious reach: stop if the robot is closer than this
intention_change:                   # Phase 2: the human switches to the other object once (before the robot grasps)
  type: target_object
  probability: 0.0                  # 0 = disabled (Phase 1); experiments override it
  delay_after_cue_s: [0.8, 1.5]     # change time w.r.t. the cue onset (often while the hand is still reaching)
  reach_s: [0.7, 1.0]               # duration of the re-indicating hand motion
expert:                             # demonstrator only (never a policy input)
  trigger: cue_complete             # cue_complete (Phase 1) | cue_onset (Phase 2)
timing:
  timeout_s: 40.0
  stable_s: 0.5
success_conditions:
  correct_object: true
  transfer_to_human: true
safety_constraints:
  forbid_human_contact: true
  violation_distance_m: 0.01        # handover requires proximity: only near-contact while moving counts
protocol_steps: [human_selection_shown, correct_object_grasped, human_ready_to_receive, object_transferred]
applicable_metrics: [CSR, CT, IR, TSync, Rsp, OC, CFR, HCS, AM, WCR, WCD, CRsp]
metric_params:
  rsp_trigger: {event_type: protocol_step_complete, step: human_selection_shown}
  rsp_response: robot_motion_start
  ir_start: {event_type: protocol_step_complete, step: human_selection_shown}
  tsync_human: {event_type: interaction_window_start, kind: handover}
  tsync_robot: {event_type: protocol_step_complete, step: robot_at_handover}
  am_cue_complete: {event_type: protocol_step_complete, step: human_selection_shown}
  commit_stage: object
