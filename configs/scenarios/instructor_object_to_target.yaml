scenario_id: instructor_object_to_target
role: instructor
goal: >-
  The human instruction names one of three objects and one of two square target regions.
  The robot must pick exactly that object and release it inside exactly that region.
task: Pick up the object the human instructs and place it in the instructed target region.          # LeRobot per-frame task string (same for every episode)
seed: 0
scene:
  base: ../scene/common.yaml
  objects:
    object_a: {shape: box, size: [0.018, 0.018, 0.018], color: red, label: red cube}
    object_b: {shape: cylinder, size: [0.02, 0.018], color: blue, label: blue cylinder}
    object_c: {shape: cross, size: [0.022, 0.008, 0.016], color: yellow, label: yellow cross}
  regions:
    target_region_a: {half_size: 0.055, color: green}
    target_region_b: {half_size: 0.055, color: purple}
  instruction_board: {pos: [0.64, -0.36, 0.74]}   # visible panel showing requested object + target colour
scene_variation:
  object_slots: [[0.27, -0.15], [0.33, 0.0], [0.27, 0.15]]   # shuffled per episode
  object_jitter_m: 0.012
  region_slots: [[0.44, -0.14], [0.44, 0.14]]                 # shuffled per episode
  region_jitter_m: 0.01
  robot_home_jitter_rad: 0.04
  appearance_permutation: false     # true => permute object colours / region colours per episode
  requested_object: [object_a, object_b, object_c]
  requested_target: [target_region_a, target_region_b]
human_behavior:
  type: instructor_pointing
  cue_onset_s: [0.4, 1.2]           # instruction board lights up + pointing starts
  point_object_s: [1.2, 1.8]
  point_target_s: [1.2, 1.8]
  speed_scale: [0.8, 1.25]
  hover_height_m: 0.10
intention_change:                   # Phase 2: the human revises the target region once while the robot carries the object
  type: target_region
  probability: 0.0                  # 0 = disabled (Phase 1); experiments override it
  delay_after_lift_s: [0.2, 0.8]    # change time w.r.t. the robot lifting the requested object
expert:                             # demonstrator only (never a policy input)
  trigger: cue_complete             # cue_complete (Phase 1) | cue_onset (Phase 2)
timing:
  timeout_s: 40.0
  stable_s: 0.5
success_conditions:
  correct_object: true
  release_inside_target: true
  object_speed_max: 0.04
  place_height_max_m: 0.05          # object centre above table after release
safety_constraints:
  forbid_human_contact: true
protocol_steps: [instruction_given, correct_object_grasped, object_released_in_target]
applicable_metrics: [CSR, CT, IR, Rsp, OC, AM, WCR, WCD, CRsp]
metric_params:                      # event definitions used by HRIBench-style metrics
  rsp_trigger: {event_type: protocol_step_complete, step: instruction_given}
  rsp_response: robot_motion_start
  ir_start: {event_type: protocol_step_complete, step: instruction_given}
  am_cue_complete: {event_type: protocol_step_complete, step: instruction_given}
  commit_stage: object
