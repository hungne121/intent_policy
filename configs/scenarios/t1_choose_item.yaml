scenario_id: t1_choose_item
task_code: T1                       # v6 (docs/sim/scenarios_v6_proposal.md, approved 2026-10-24); HABIT 'Provide the
role: instructor                    #   desired donut to the person' / 'Place the items the person wants into the basket'
goal: >-
  Three donuts stand on 3 of the 6 robot-zone slots S1-S6 (in 1/3 of the episodes two of them are identical twins
  next to each other or not, and the wanted one is one of them). The human indicates the wanted donut, by pointing at
  it or by reaching an open hand towards it (drawn per episode), then points at one of two trays in front of them
  (P1, P2). The robot must put exactly that donut on that tray without touching the others and return to rest.
  T5 (a scenario-list spec with `change`): the human changes their mind before the robot is done; the robot follows.
task: Give the person the donut they want on the tray they show, then return to rest.
seed: 0
scene:
  base: ../scene/common.yaml
  objects: [D1, D2, D3, D1p, D2p, D3p]
  zone_markers: false               # real trays instead of tape (v6)
  decor:                            # trays on the place zones P1 / P2 (configs/layout.yaml), 11 x 10 x 0.8 cm
    - {name: tray_P1, type: box, xy: [0.24, -0.03], size: [0.055, 0.05, 0.004], color: tray}
    - {name: tray_P2, type: box, xy: [0.36, -0.03], size: [0.055, 0.05, 0.004], color: tray2}
scene_variation:                    # random episodes when no scenario-list spec is given (tests, ad-hoc runs);
  slot_kind: item                   # the donuts stand on I1-I3 (configs/layout.yaml, ~14 deg apart from the human)
  n_objects: 3                      # the balanced lists come from scripts/generate_scenarios.py
  pair_probability: 0.333           # identical pair B1 + B1' on the table, the target one of them (§5.2 rule 3)
  object_jitter_m: 0.008
  object_yaw_rad: 0.2
  robot_home_jitter_rad: 0.04
human_behavior:
  type: t1_instructor
  object_gestures: {point: 0.5, reach: 0.5}   # v6: how the wanted donut is indicated (per episode)
  reach_object_s: [1.0, 1.5]        # reach towards the donut; provisional = point_s before its x1.5 (2026-10-13),
                                    #   to be measured on HABIT S7414 (TODO)
  reach_height_m: 0.10              # the palm aims along the line to this far above the donut ...
  reach_max_y: -0.08                # ... and stops at this depth: 0.28 m from the table edge, the comfortable reach
                                    #   (configs/layout.yaml, 0.25-0.30 m), so the hand stays out of the robot's area
  cue_onset_s: [0.4, 1.2]           # the first pointing motion starts
  point_s: [1.5, 1.95]              # duration of a pointing motion # x1.5 (2026-10-13, INTENT_ACT_v3.2.md §4.2j): deliberate robot-directed gesture
  point_dwell_s: [0.3, 0.6]         # minimum hold after the pointing arrived (2026-10-03, was 1.8-2.5) ...
  rest_s: [0.9, 1.2]                # back to the rest pose
  point_hold_max_s: 6.0             # ... then kept until the robot's hand is above the target, at most this (user 2026-10-03)
  pick_wait_max_s: 15.0             # turn by turn: the place zone is shown once the robot has lifted the cube
  point_length_m: 0.50              # pointing palm: this far from the shoulder along the ray (arm nearly straight)
  speed_scale: [0.8, 1.25]
  motion_bank:                      # generated hand motions (HY-Motion 1.0-Lite library, configs/human_motion/hymotion_v6.yaml,
                                    #   sim/motion_bank.py): these motion labels use a library motion of the listed kinds
    folder: outputs/human_motion/hymotion_v6_2026-10-24
    min_dist_m: 0.08                # shorter moves keep the minimum-jerk line
    min_cos: 0.3                    # the library motion heads within ~72 deg of the needed direction (horizontal) ...
    extent_ratio: [0.4, 2.5]        # ... and its extent is comparable to the needed distance
    table_edge_y: -0.36             # configs/layout.yaml table y min (the human's edge)
    table_margin_m: 0.03            # the palm stays this far above the table top
    holding_margin_m: 0.08          # ... this far while holding something (it hangs ~3 cm below the palm)
    robot_clear_m: 0.15             # a library motion passing closer to the robot (along its links) is not used
    max_dev_ratio: 0.25             # ... nor one straying from the straight line by more than this x the distance:
                                    #   human hand paths are nearly straight, slightly curved (Spatial control of arm
                                    #   movements - Morasso - 1981; Kinematic features of unrestrained vertical arm
                                    #   movements - Atkeson, Hollerbach - 1985)
    labels:
      reach_object: [t1_reach_*]
      point_object: [t1_point_*]
      point_place: [t1_point_*]
      return_rest: [t1_*, idle_*]
      withdraw_change: [t1_switch, t1_hesitate, t1_reach_*]
intention_change:                   # T5; `probability` > 0 adds random changes to random episodes (tests)
  probability: 0.0
  late_trigger_m: 0.15              # late change: TCP within this horizontal distance of the old target, no grasp yet
  withdraw_s: [1.0, 1.3]            # the pointing hand is withdrawn to rest (clearly) before pointing at the new target
  pause_s: [0.4, 0.7]               # pause at rest before pointing at the new target
  early_dwell_s: [0.7, 1.0]         # early change: the first pointing is held this long, then withdrawn
  # (2026-10-03) free timing, replaces early / late and late_trigger_m: the change of mind comes a random time after
  # the first indication completed, whatever the robot is doing (heading for, lowering to, holding or carrying the old
  # target); T1 / T2 first signal 'wait' (open hand, palm down, held out towards the robot), then point at the twin
  delay_s: [0.3, 6.0]
  stop_s: [0.6, 0.9]                # the 'wait' hand moves out ... # x1.5 (2026-10-13, INTENT_ACT_v3.2.md §4.2j): deliberate robot-directed gesture
  stop_hold_s: [0.4, 0.8]           # ... and is held this long
expert:                             # demonstrator only (never a policy input)
  trigger: cue_complete             # until the v6 measuring device exists (M5); cue_onset (clairvoyant) fails
                                    #   T5 changes of mind in the old T1 too (6/12, check 2026-10-24 16:52)             # cue_complete (act once the instruction is complete) | evidence | cue_onset
  travel_dz: 0.13                   # travel height above the table (cubes only)
timing:
  timeout_s: 45.0
  stable_s: 0.5
success_conditions:
  object_speed_max: 0.04
  place_height_max_m: 0.05          # object centre above the table after release
  zone_margin_m: 0.01               # object centre at least this far inside the 12 x 12 cm tape square
  other_object_moved_max_m: 0.02    # "không chạm vật khác": other objects stay put and are never touched
  rest_tolerance_m: 0.04            # back at rest: TCP within this distance of the rest pose, gripper empty
safety_constraints:
  forbid_human_contact: true
protocol_steps: [object_indicated, object_grasped, place_indicated, object_placed, robot_at_rest]   # turn by turn (2026-10-03)
applicable_metrics: [CSR, CT, IR, Rsp, OC, AM, WCR, WCD, CRsp]
metric_params:                      # event definitions used by HRIBench-style metrics
  rsp_trigger: {event_type: protocol_step_complete, step: object_indicated}
  rsp_response: robot_motion_start
  ir_start: {event_type: protocol_step_complete, step: object_indicated}
  am_cue_complete: {event_type: protocol_step_complete, step: object_indicated}
  commit_stage: object
