# v10 C4 (docs/PIF.md §8.12 "5 task bổ sung theo HABIT", 01/11/2026; HABIT S7025 'Waste Sorting' adapted): the human
# takes the waste items one by one from a mixed pile and waits holding each; the robot holds out the bin of its kind
# (left: cans, right: plastic), the human drops it in, the robot puts the bin back. Prototype for the v9 G3 gate:
# layout values are design values, to be checked by pilots (reach, contacts) before any collection.
scenario_id: c4_waste_sort
task_code: T3
role: collaborator
goal: The human drops each waste item into the bin of its kind, which the robot holds out for it.
task: Hold out the bin of the item the person takes (cans left, plastic right), put it back afterwards, then rest.
seed: 0
scene:
  base: ../scene/common.yaml
  grasp_attach_substep: true
  grasp_hold_squeeze_m: 0.0
  human:
    hand_mesh_mode: compiled_variants
    held_object_frame: hand
  objects:
    W_C1: {shape: box, size: [0.0125, 0.0125, 0.0125], color: red, label: can waste 1}
    W_C2: {shape: box, size: [0.0125, 0.0125, 0.0125], color: red, label: can waste 2}
    W_P1: {shape: box, size: [0.0125, 0.0125, 0.0125], color: blue, label: plastic waste 1}
    W_P2: {shape: box, size: [0.0125, 0.0125, 0.0125], color: blue, label: plastic waste 2}
    B_CAN: {shape: cup, size: [0.07, 0.07], wall: 0.008, color: red, label: can bin}   # 8 mm: a dropped cube went through a 4 mm bottom
    B_PL: {shape: cup, size: [0.07, 0.07], wall: 0.008, color: blue, label: plastic bin}
  zone_markers: false
scene_variation:
  variant: coaster                  # spec / human generator of the v6 coaster task (overridden below)
  cup: B_CAN
  coaster: W_C1
  object_jitter_m: 0.0
  object_yaw_rad: 0.2
  robot_home_jitter_rad: 0.04
  c4:
    items: [W_C1, W_C2, W_P1, W_P2]
    kind: {W_C1: can, W_C2: can, W_P1: plastic, W_P2: plastic}
    bin_objects: {can: B_CAN, plastic: B_PL}
    bins: {can: [0.16, 0.20], plastic: [0.38, 0.14]}   # 0.23 m apart, both within R_eff 0.43 (grasp on the -x rim)
    pile_xy: [0.24, -0.21]          # front-left of the human, within comfortable reach (configs/layout.yaml); off the bin route
    pile_offsets: [[-0.04, -0.04], [0.04, -0.04], [-0.04, 0.04], [0.04, 0.04]]   # 8 cm apart, kinds mixed by seed
    jitter_m: 0.008
    yaw_rad: 0.1
    pause_s: [0.5, 2.0]             # the human's own pace between items (design range)
human_behavior:
  type: t3_coaster
  cue_onset_s: [0.4, 1.5]
  take_reach_s: [0.8, 1.2]
  carry_s: [0.8, 1.1]
  lower_s: [0.5, 0.7]
  carry_height_m: 0.04
  lift_m: 0.10
  grip_dz_m: 0.101                  # 'grasp' hand 85.3 mm below the palm (I1, 60 poses) + cube half 12.5 + 3 mm
  hold_xyz: [0.38, -0.23, 0.17]     # the taken item held here (z above the table) while waiting for its bin
  present_xy: [0.40, -0.08]         # where the robot holds the bin out (its centre, front-right, 0.41 m from the base) ...
  present_dz_m: 0.06                # ... its bottom this high above the table
  drop_dx_m: 0.045                  # the item released 4.5 cm off the bin centre, away from the gripper (-x rim): the palm
                                    #   met the gripper base at 2.5 cm (14 cm bins) ...
  drop_dz_m: 0.03                   # ... its bottom this far above the rim
  spot_jitter_m: 0.0
  point_s: [1.0, 1.0]
  point_dwell_s: [0.3, 0.5]
  rest_s: [0.9, 1.2]
  speed_scale: [0.8, 1.25]
  motion_bank:
    folder: outputs/human_motion/hymotion_ten_tasks_2026-10-30/hymotion_out
    split_manifest: outputs/human_motion/hymotion_ten_tasks_2026-10-30/splits.json
    split: train
    min_dist_m: 0.08
    min_cos: 0.3
    extent_ratio: [0.4, 2.5]
    table_edge_y: -0.36
    table_margin_m: 0.03
    holding_margin_m: 0.08
    robot_clear_m: 0.15
    max_dev_ratio: 0.25
    labels:
      reach_item: ['*']
      reach_item_f: ['*']
      reach_decoy: ['*']
      lift_decoy: ['*']
      return_decoy: ['*']
      lift_item: ['*']
      to_bin: ['*']
      withdraw_item: ['*']
      withdraw: ['*']
  hand_clearance: {window_s: 0.25, iterations: 3}
  yield_to_robot: {max_wait_s: 3.0, lookahead_s: 0.25, wait_for_bank: true, before_start: false,
                   exempt_labels: [wait_bin, to_bin, withdraw_item]}   # the drop into the held-out bin is meant to be close
intention_change:
  probability: 0.0
  late_trigger_m: 0.15
expert:
  rule: observed
  travel_dz: 0.17                   # the held bin (7 cm) clears the pile's items
  decision:                         # docs/PIF.md §8.12 "Công thức quyết định và phục hồi" (both rules, only the input differs)
    sigma_m: 0.0795                 # alpha = 1 / sigma: ManiCast wrist error at 1 s on transitions (outputs/forecast_ft/2026-10-31_08-42)
    beta: 1.0                       # heading weight (Fang et al. 2026)
    still_speed: 0.01               # m/s: below it a hand counts as still (heading term 0); the mannequin at rest does not drift
    velocity_window_s: 0.2          # the seen wrist velocity over this window
    tau: 0.5                        # commit threshold on the group belief (Fang et al. 2026: 0.5), calibrated per rule below
    eps: 0.10                       # target rate of wrong commitments (design value, no source)
    eta: 0.05                       # Conformal Decision Theory step size (design value; the update rule: Lekeufack et al. 2024)
    forecast_waypoints: 8           # the forecast at D's waypoints (configs/intent_schema_v6.yaml: 8 over 1 s), PIF §8.12
    forecast_horizon_s: 1.0
    path_features: endpoint         # endpoint | closest | stop: what the belief reads of the forecast path (ablation)
  conflict_m: 0.14
  conflict_z_m: 0.25
  wait_xy: [0.27, 0.17]
timing:
  timeout_s: 90
  stable_s: 0.5
success_conditions:
  object_speed_max: 0.04
  other_object_moved_max_m: 0.02
  rest_tolerance_m: 0.04
safety_constraints:
  forbid_human_contact: true
protocol_steps: [robot_at_rest]
applicable_metrics: [CSR, CT]
metric_params: {}
