# v7 C3 (docs/PIF.md §8.5 / §8.10 / §8.11; HABIT S6002 for a one-arm robot): the human brings a folded cloth to the
# tray of their choice; the robot lifts that tray's bowl, holds it aside, and sets it on the cloth once the cloth is
# down and the hand has left. scenarios/c3_cloth_bowl.py, experts/c3_expert.py.
scenario_id: c3_cloth_bowl
collection_ready: true
task_code: T3
role: collaborator
goal: The human puts a folded cloth on one of two trays; the robot lifts that tray's bowl in time and sets it on the
  cloth afterwards.
task: Lift the bowl of the tray the cloth goes to, set it on the cloth, return to rest.
seed: 0
scene:
  base: ../scene/common.yaml
  grasp_attach_substep: true        # as I1 / C1 (robot grasp at the two-finger contact substep, PIF §8.12)
  grasp_hold_squeeze_m: 0.0005
  human:
    hand_mesh_mode: compiled_variants
    held_object_frame: hand
  objects:
    BWA: {shape: cup, size: [0.05, 0.05], color: white, label: bowl on tray A}
    BWB: {shape: cup, size: [0.05, 0.05], color: blue, label: bowl on tray B}
    CL: {shape: box, size: [0.055, 0.05, 0.006], color: pink, label: folded cloth}
  zone_markers: false
  # trays: static, 15 x 13 cm, 6 mm; 0.234 / 0.408 m from the robot base (between R_SAFE 0.22 and R_eff 0.43,
  # configs/layout.yaml) and within the human's comfortable reach (storyboard's 0.15 m tray was inside R_SAFE)
  decor:
  - {name: TA, type: box, xy: [0.22, -0.08], size: [0.075, 0.065, 0.003], color: tray2}
  - {name: TB, type: box, xy: [0.40, -0.08], size: [0.075, 0.065, 0.003], color: tray2}
scene_variation:
  variant: coaster                  # spec / human generator of the v6 coaster task (cup = a bowl, coaster = the cloth)
  cup: BWA
  coaster: CL
  object_jitter_m: 0.008
  object_yaw_rad: 0.2
  robot_home_jitter_rad: 0.04
  c3:
    trays: {TA: [0.22, -0.08], TB: [0.40, -0.08]}
    bowls: {TA: BWA, TB: BWB}
    cloth: CL
    cloth_xy: [0.31, -0.27]         # in front of the human (U)
    cloth_jitter_m: 0.01
    bowl_jitter_m: 0.008
    tray_top_m: 0.006
human_behavior:
  type: t3_coaster
  cue_onset_s: [0.4, 2.5]           # the cloth is taken before or after the robot could act on its own
  take_reach_s: [0.8, 1.2]
  carry_s: [1.0, 1.5]
  lower_s: [0.4, 0.6]
  carry_height_m: 0.12
  # palm point -> lowest vertex of the 'grasp' hand 85.3 mm (I1, 60 poses) + cloth half thickness 6 mm
  grip_dz_m: 0.092
  spot_jitter_m: 0.0
  tray_top_m: 0.006
  tray_radius_m: 0.06               # a bowl farther than this from its tray centre (or 3 cm up) has left the tray
  wait_offset_xy: [0.0, -0.18]      # the cloth waits next to the tray on the human side while the bowl is on it: beyond
                                    #   the expert guard (GUARD_OCCUPIED_XY 0.14 m; at 0.12 robot and human waited for each other)
  point_s: [1.0, 1.0]
  point_dwell_s: [0.3, 0.5]
  rest_s: [0.9, 1.2]
  speed_scale: [0.8, 1.25]
  motion_bank:
    folder: outputs/human_motion/hymotion_ten_tasks_2026-10-30/hymotion_out
    split_manifest: outputs/human_motion/hymotion_ten_tasks_2026-10-30/splits.json
    split: train
    min_dist_m: 0.08
    min_cos: 0.3
    extent_ratio: [0.4, 2.5]
    table_edge_y: -0.36
    table_margin_m: 0.03
    holding_margin_m: 0.08
    robot_clear_m: 0.15
    max_dev_ratio: 0.25
    labels:
      reach_cloth: ['*']
      carry_cloth: ['*']
      carry_towards_decoy: ['*']    # C4 early: the short first part (HY-Motion when >= 8 cm, else minimum-jerk, logged)
      over_tray: ['*']
      lower_cloth: ['*']
      withdraw: ['*']
  hand_clearance: {window_s: 0.25, iterations: 3}
  yield_to_robot: {max_wait_s: 3.0, lookahead_s: 0.25}
  level_on_put: {labels: [lower_cloth], from_progress: 0.5}
intention_change:
  probability: 0.0
  late_trigger_m: 0.15
expert:
  rule: observed
  travel_dz: 0.20
  commit_radius_m: 0.15             # a stop / prediction this close to a tray's waiting point (trays 0.18 m apart)
  switch_margin_m: 0.03             # early: another tray must be this much nearer to switch (no flicker)
  hold_offset_xy: [0.0, 0.17]       # the lifted bowl waits here, away from the human (+y)
timing:
  timeout_s: 60
  stable_s: 0.5
success_conditions:
  on_place_xy_m: 0.03
  cloth_on_tray_xy_m: 0.04
  object_speed_max: 0.04
  other_object_moved_max_m: 0.02
  rest_tolerance_m: 0.04
safety_constraints:
  forbid_human_contact: true
protocol_steps: [coaster_taken, bowl_on_cloth, robot_at_rest]
applicable_metrics: [CSR, CT]
metric_params: {}
