# Design proposal only; not a runtime/training config or a source of policy labels.
# Sources, rationale and user decisions: docs/PIF.md §8.8.
version: 2
updated_local: '2026-10-28 16:44 Asia/Saigon'
status: proposal_pending_forecast_physics_and_policy_pilots
user_confirmed:
  require_every_case_on_every_task: false
  use_natural_cases_per_task: true
  use_a_small_deep_suite_for_all_four_cases: true
  c3_sources: [natural_manicast_error, controlled_forecast_intervention]
  c3_report_sources_separately: true
candidate_pool:
  count: 10
  roles: {instructor: 3, collaborator: 4, cowork: 3}
  final_count_or_role_change_approved: false
architecture:
  motion_tokens: 8
  observation_history_s: 0.4
  forecast_horizon_s: 1.0
  add_intent_labels_or_explicit_velocity_to_act: false
priority_pilot: [I1, C1, C2, C3, C4, W1]
deep_four_case_candidates: [C1, C4]
deep_suite_backup: C3
cost_sensitive_design:
  source: docs/PIF.md §8.10
  status: specification_only_not_rendered_or_validated
  primary_tasks: [C3, C4]
  standard_start: empty_gripper_objects_at_sources_drawers_closed
  include_preparation_in_episode_time: true
  axes:
    evidence: [supports_initial_goal, ambiguous_between_goals, observable_goal_change]
    commitment: [before_target_specific_action, approaching, grasped_or_partly_open, transported_or_fully_open]
    recovery_cost: measured_feasible_remaining_work_not_assigned_from_elapsed_time
  vary_geometry_one_factor_at_a_time: true
  geometry_factors:
    C3: [tray_separation, distance_to_legal_putdown, legal_staging_availability]
    C4: [drawer_travel, drawer_separation, obstruction_from_open_drawer]
  recovery_options:
    allow_legal_temporary_putdown: true
    require_close_wrong_drawer_before_opening_correct_only_if_physically_or_procedurally_required: true
    validate_final_object_and_drawer_state: true
  matched_cases: [keep_initial_goal, switch_before_grasp_or_open, switch_after_grasp_or_open]
  extra_transport_or_opening_stages_only_if_measured_cost_differs: true
  report_sunk_work_separately_from_remaining_recovery_cost: true
  sunk_work_does_not_justify_persisting_with_cancelled_goal: true
  end_to_end_human_schedule: matched_exogenous_schedule_or_separately_reported_shared_reactive_rule
  robot_state_triggered_switches: diagnostic_only_not_pooled_with_end_to_end_claim
  recovery_diagnostic_requires_consistent_observation_and_controller_history: true
  measure: [overall_success, joint_completion_time, human_wait, actual_commitment_at_cue,
            useful_preparation_retained, response_latency_from_observable_cue,
            recovery_path_length, recovery_manipulation_count, feasible_expert_recovery_time,
            safety_violations]
  scalar_cost_weights: unset_report_raw_components
  preview_count: choose_after_mechanism_and_cost_validation
  current_26_previews_cover_cost_axis: false
tasks:
  I1:
    name: Nhiều đế lót ở vị trí liên tục
    role: instructor
    priority: primary_pilot
    preferred_cases: [C1, C2]
    conditional_cases: [C3_natural, C3_controlled]
    main_question: Forecast có báo vị trí dừng tay sớm đủ để robot mang cốc tới không?
    limitation: Không ép người di chuyển lại đế đã đặt để tạo đổi ý.
  I2:
    name: Tay trái hoặc phải chọn phía vật
    role: instructor
    priority: simple_comparison
    preferred_cases: [C1]
    conditional_cases: [C4]
    main_question: ManiCast có thêm lợi thế so với nhận tay hoạt động từ ảnh hiện tại và CVM không?
    limitation: Giơ nửa tay không tự là mơ hồ; lấy đồ riêng không tự là forecast error.
  I3:
    name: Ra hiệu dừng khay
    role: instructor
    priority: deferred
    preferred_cases: []
    main_question: Có thể tách dự báo giảm tốc hữu ích khỏi nhận dạng cử chỉ dừng không?
    limitation: Chưa có bằng chứng đủ để ưu tiên task hoặc bốn case.
  C1:
    name: T2 trao lon sau công việc
    role: collaborator
    priority: deep_four_case_candidate
    preferred_cases: [C1, C2, C3_natural, C3_controlled, C4]
    main_question: Dự báo điểm gặp và sẵn sàng nhận có giúp trao sớm và hủy đúng khi cue thay đổi không?
    limitation: Không gọi lỗi grounding xin lon là lỗi ManiCast nếu dự báo cổ tay vẫn đúng.
  C2:
    name: Người nhấc giá để robot lau
    role: collaborator
    priority: primary_pilot
    preferred_cases: [C1, C2]
    main_question: Robot có giảm thời gian người giữ giá bằng cách chuẩn bị đúng vùng và thời điểm không?
    limitation: Vẫn phải chờ vùng thực sự trống trước tiếp xúc; C2 cần continuation khác thật sự.
  C3:
    name: Nhấc bát để người trải khăn
    role: collaborator
    priority: primary_pilot_and_deep_backup
    preferred_cases: [C1, C2, C4]
    conditional_cases: [C3_natural, C3_controlled]
    main_question: Robot có nhấc và đặt bát đúng lúc, và trả bát A khi người chuyển sang khay B không?
    limitation: C4 nên có bát A đã được nhấc, thay vì chỉ đổi hướng ở vùng chờ.
  C4:
    name: Mở đúng ngăn kéo để người cất đồ
    role: collaborator
    priority: deep_four_case_candidate_with_physics_gate
    preferred_cases: [C1, C2, C3_natural, C3_controlled, C4]
    main_question: Lợi ích mở sớm so với chi phí đóng ngăn sai và mở ngăn đúng là gì?
    limitation: Cần thao tác ngăn kéo có vật lý ổn; log đích cố định hoặc đổi đích chỉ dùng đánh giá.
  W1:
    name: Hai bên đóng hộp trong vùng đồ chung
    role: cowork
    priority: primary_pilot
    preferred_conditions: [safe_alternative_available, no_safe_alternative_wait, resume_after_clearance]
    conditional_cases: [C3_natural, C3_controlled, C4_local_target_or_motion_plan]
    main_question: Robot nhường và tiếp tục làm mượt, không gây gián đoạn người, có tiến độ không?
    limitation: Không gọi mọi đổi đường là đổi mục tiêu; báo cấp độ local target hoặc motion plan.
  W2:
    name: Người mang vật lớn qua vùng robot làm việc
    role: cowork
    priority: geometry_extension
    preferred_conditions: [held_object_swept_volume, arrival_timing_error, motion_plan_change]
    main_question: Robot có dùng ảnh cùng forecast tay để tránh cả vật người đang mang không?
    limitation: Hình học vật không được cung cấp bởi sáu khớp ManiCast; chỉ giữ riêng nếu khác W1.
  W3:
    name: Người thao tác lâu trong vùng chung
    role: cowork
    priority: deferred_or_stationary_comparison
    preferred_conditions: [near_static_human_control, resume_after_clearance]
    main_question: Robot có tránh chờ hoặc giật thừa khi CUR đã đủ không?
    limitation: Không coi chiếm vùng lâu đơn thuần là bằng chứng lợi ích forecast.
evaluation_requirements:
  prediction_baselines: [current_pose, constant_velocity_same_history, manicast]
  natural_error_scope: held_out_all_episodes_and_error_stratum
  controlled_error_scope: matched_human_goal_scene_seed_and_short_token_intervention
  error_attribution: [perception, motion_forecast, policy_grounding, manipulation_control]
  c2_does_not_assume_manicast_confidence_output: true
  c4_log_goal_switch_and_first_observable_contradiction_separately: true
  recovery_report: [commit_rate, overall_success, success_conditional_on_prior_action]
  cowork_metrics: [collision, minimum_separation, necessary_wait, avoidable_wait, resume_latency,
                   excessive_stop_start, motion_smoothness, human_interruption, useful_progress]
  human_interruption_requires_reactive_human_or_user_measurement: true
  thresholds: to_be_justified_by_pilot
  existing_storyboard_labels_are_not_validated_experimental_cases: true
